<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IlloComoVamos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ AUTH ============ -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h1>IlloComoVamos</h1>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Log In</button>
        <button class="auth-tab" id="tabSignup">Sign Up</button>
      </div>

      <div class="auth-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button id="loginBtn">Log In</button>
      </div>

      <div class="auth-form hidden" id="signupForm">
        <input type="text" id="signupUsername" placeholder="Username">
        <input type="email" id="signupEmail" placeholder="Email">
        <input type="password" id="signupPassword" placeholder="Password (6+ chars)">
        <button id="signupBtn">Create Account</button>
      </div>

      <p class="auth-error" id="authError"></p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app hidden" id="appRoot">

    <div class="header">
      <h1>IlloComoVamos <span id="myUsernameLabel">…</span></h1>

      <button class="lobby-btn hidden" id="backToLobbyBtn">← Lobby</button>

      <button class="profile-btn" id="profileBtn" title="My Profile">
        <img id="myPfpBtn" alt="">
      </button>
      <button class="icon-btn" id="logoutBtn" title="Log Out">↩</button>

      <div class="status-badge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">disconnected</span>
      </div>
    </div>

    <!-- ============ LOBBY ============ -->
    <div class="lobby-view" id="lobbyView">
      <div class="lobby-head">
        <h2>Rooms</h2>
        <div class="lobby-actions">
          <button class="secondary-btn" id="openPublicRoomBtn">Public Lobby</button>
          <button class="primary-btn" id="openCreateRoomBtn">+ Create Room</button>
        </div>
      </div>
      <div class="room-grid" id="roomGrid">
        <p class="lobby-empty">Loading rooms…</p>
      </div>
    </div>

    <!-- ============ ROOM ============ -->
    <div class="room-view hidden" id="roomView">
      <div class="body-row">

        <aside class="side-panel">
          <div class="side-title">
            Online — <span id="onlineCount">0</span>
            <span id="capacityLabel" class="capacity-label"></span>
          </div>
          <div class="user-list" id="userList"></div>

          <div class="side-title hidden" id="adminPanelTitle">Admin</div>
          <div class="side-admin hidden" id="adminPanel">
            <button id="kickPanelBtn">Manage Kicked</button>
            <button id="roomSettingsBtn">Room Settings</button>
          </div>
        </aside>

        <div class="chat-column">
          <div class="chat-head" id="chatHead">
            <span id="chatHeadTitle"># room</span>
            <span class="lock-tag hidden" id="chatHeadLock">🔒</span>
            <span class="admin-badge hidden" id="adminBadge">ADMIN</span>
            <button class="close-dm hidden" id="closeDmBtn">← Back to room</button>
          </div>

          <div class="chat-container" id="chatContainer">
            <div class="empty-state" id="emptyState">
              <span>💬</span>
              <p>No messages yet</p>
            </div>
          </div>

          <div class="input-area">
            <div class="file-preview hidden" id="filePreview">
              <img id="filePreviewImg" alt="">
              <video id="filePreviewVideo" controls class="hidden"></video>
              <div class="file-preview-info">
                <span id="filePreviewName"></span>
                <button id="filePreviewRemove">✕</button>
              </div>
            </div>

            <div class="input-row">
              <input type="text" id="messageInput" placeholder="Type a message..." disabled>
              <label class="file-label" id="fileLabel">
                Media
                <input type="file" id="fileInput" accept="image/*,video/*,image/gif" disabled>
              </label>
              <button class="send-btn" id="sendBtn" disabled>Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: USER ACTIONS ============ -->
  <div class="modal-backdrop hidden" id="userModal">
    <div class="modal">
      <div class="modal-head">
        <img class="modal-pfp" id="modalPfp" alt="">
        <div>
          <div class="modal-name" id="modalName">—</div>
          <div class="modal-bio" id="modalBio">—</div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modalDmBtn">Send DM</button>
        <button id="modalBlockBtn">Block</button>
        <button id="modalKickBtn" class="danger hidden">Kick from room</button>
        <button class="ghost" id="modalCloseBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: MY PROFILE ============ -->
  <div class="modal-backdrop hidden" id="profileModal">
    <div class="modal profile-modal">
      <div class="profile-hero">
        <div class="profile-avatar-wrap">
          <img class="profile-avatar" id="myProfileAvatar" alt="">
          <label class="profile-avatar-edit">
            ✎
            <input type="file" id="editPfp" accept="image/*">
          </label>
        </div>
        <div class="profile-hero-name" id="profileHeroName">—</div>
        <div class="profile-hero-email" id="profileHeroEmail">—</div>
      </div>

      <h2>Edit Profile</h2>

      <label class="field">
        <span>Username</span>
        <input type="text" id="editUsername" maxlength="24">
      </label>

      <label class="field">
        <span>Bio</span>
        <textarea id="editBio" rows="3" maxlength="200"></textarea>
      </label>

      <div class="modal-actions">
        <button id="saveProfileBtn">Save</button>
        <button class="ghost" id="cancelProfileBtn">Cancel</button>
      </div>
      <p class="auth-error" id="profileError"></p>
    </div>
  </div>

  <!-- ============ MODAL: CREATE ROOM ============ -->
  <div class="modal-backdrop hidden" id="createRoomModal">
    <div class="modal">
      <h2>Create Room</h2>

      <label class="field">
        <span>Room code (unique id)</span>
        <input type="text" id="createRoomCodeInput" placeholder="my-room" maxlength="32">
      </label>

      <label class="field">
        <span>Room name</span>
        <input type="text" id="createRoomName" placeholder="Lobby Name" maxlength="40">
      </label>

      <label class="field">
        <span>Max users (2–500)</span>
        <input type="number" id="createRoomMax" min="2" max="500" value="20">
      </label>

      <label class="field">
        <span>Password (optional)</span>
        <input type="password" id="createRoomPassword" placeholder="Leave empty for no password">
      </label>

      <div class="modal-actions">
        <button id="createRoomBtn">Create</button>
        <button class="ghost" id="cancelCreateRoomBtn">Cancel</button>
      </div>
      <p class="auth-error" id="createRoomError"></p>
    </div>
  </div>

  <!-- ============ MODAL: ROOM PASSWORD ============ -->
  <div class="modal-backdrop hidden" id="passwordModal">
    <div class="modal">
      <h2>Password Required</h2>
      <p class="modal-sub">Room <b id="passwordRoomCode">—</b> is locked.</p>

      <label class="field">
        <span>Password</span>
        <input type="password" id="joinRoomPassword" placeholder="Enter password">
      </label>

      <div class="modal-actions">
        <button id="submitPasswordBtn">Join</button>
        <button class="ghost" id="cancelPasswordBtn">Cancel</button>
      </div>
      <p class="auth-error" id="passwordError"></p>
    </div>
  </div>

  <!-- ============ MODAL: KICKED ============ -->
  <div class="modal-backdrop hidden" id="kickedModal">
    <div class="modal">
      <h2>Kicked Users</h2>
      <div class="kicked-list" id="kickedList">
        <p class="modal-sub">Nobody is kicked.</p>
      </div>
      <div class="modal-actions">
        <button class="ghost" id="closeKickedBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: ROOM SETTINGS ============ -->
  <div class="modal-backdrop hidden" id="roomSettingsModal">
    <div class="modal">
      <h2>Room Settings</h2>

      <label class="field">
        <span>Room name</span>
        <input type="text" id="settingsRoomName" maxlength="40">
      </label>

      <label class="field">
        <span>Max users (2–500)</span>
        <input type="number" id="settingsRoomMax" min="2" max="500">
      </label>

      <label class="field">
        <span>Change password (leave empty to keep)</span>
        <input type="password" id="settingsRoomPassword" placeholder="New password">
      </label>

      <div class="modal-actions">
        <button id="saveRoomSettingsBtn">Save</button>
        <button class="ghost" id="cancelRoomSettingsBtn">Cancel</button>
      </div>
      <p class="auth-error" id="roomSettingsError"></p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
